name: CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: iris-databricks-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks authentication
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks current-user me

      - name: Upload training script to Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_DEPLOY_DIR: ${{ vars.DATABRICKS_DEPLOY_DIR }}
        run: |
          : "${DATABRICKS_DEPLOY_DIR:?Set the DATABRICKS_DEPLOY_DIR repository variable}"
          databricks workspace mkdirs "$DATABRICKS_DEPLOY_DIR"
          databricks workspace import "$DATABRICKS_DEPLOY_DIR/train_model.py" \
            --file notebooks/train_model.py \
            --format RAW \
            --overwrite

      - name: Trigger Databricks Job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_JOB_ID: ${{ vars.DATABRICKS_JOB_ID }}
        run: |
          : "${DATABRICKS_JOB_ID:?Set the DATABRICKS_JOB_ID repository variable}"
          databricks jobs run-now "$DATABRICKS_JOB_ID"